  about:
    lead: I’m a mechanical engineer who builds things out of curiosity.
    portrait: ../assets/site/portrait.jpg
    portraitAlt: Nicolas Coleman smiling on a wooden deck among tall trees, in a white graphic hoodie and brown cargo pants.
    body:
      - In November 2016, a Hacksmith Industries video made me curious enough to build an electromagnetic Captain America shield. Almost eight years later I was working at Hacksmith as an R&D engineering intern, helping develop a pneumatic power-armor exoskeleton.
      - Along the way I’ve been a robotics intern at Kind Humanoid, where I designed a biomimetic, tendon-driven robotic finger, and an R&D intern at Walt Disney Imagineering, contributing to the next generation of aqueous animatronics. I did all of that while studying mechanical engineering at Stanford.
      - I like building things that wouldn’t exist otherwise, especially ones that make people feel super.

  experience:
    - org: Walt Disney Imagineering
      role: Research & Development Engineering Intern
      dates: June to September 2025, and June 2026 to present
      location: Glendale, CA
      note: Next-generation aqueous animatronics. On the team’s hydrofoil character, I’ve developed test equipment and the connection between its mast, foil and motor.
    - org: Hacksmith Industries
      role: Research & Development Engineering Intern
      dates: 2024
      location: Cambridge, ON
      note: Contributed to the pneumatic design of a power-armor exoskeleton and interfaced it with the state machine that controls its movements.
    - org: Kind Humanoid
      role: Robotics Engineering Intern
      dates: 2023 to 2024
      location: Palo Alto, CA
      note: Designed my first biomimetic robotic finger, working through multiple versions in three weeks.
    - org: Stanford University
      role: B.S. Mechanical Engineering
      dates: Class of 2026
      location: Stanford, CA

