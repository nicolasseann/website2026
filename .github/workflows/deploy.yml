name: Deploy to GitHub Pages

on:
  # Rebuild and publish the site every time changes are pushed to main.
  push:
    branches: [main]
  # Also allows a manual run from the Actions tab on GitHub.
  workflow_dispatch:

# Lets this workflow read the repository and publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Run one deploy at a time so two pushes can't publish over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
